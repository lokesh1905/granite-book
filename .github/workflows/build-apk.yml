name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Check the signing secrets exist
        run: |
          for v in KEYSTORE_B64 KS_PASS; do
            if [ -z "${!v}" ]; then echo "::error::GitHub secret for $v is missing. Run the 'Make signing key' workflow once and add the secrets."; exit 1; fi
          done
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KS_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Prepare web files and update settings
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          CHECK_KEY: ${{ secrets.CHECK_KEY }}
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -n "$SYNC_URL" ] && [ -n "$CHECK_KEY" ]; then
            printf 'window.GB_UPD={url:"%s",key:"%s"};\n' "$SYNC_URL" "$CHECK_KEY" > www/sync-config.js
          else
            echo "::warning::SYNC_URL or CHECK_KEY is missing, so this build cannot check for updates."
            echo "" > www/sync-config.js
          fi
      - run: npm install
      - run: npx cap add android
      - name: Sign with the private release key and raise the version
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KS_PATH"))
                      storePassword System.getenv("KS_PASS")
                      keyAlias "granitebook"
                      keyPassword System.getenv("KS_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle
      - name: Turn off Android cloud backup of the app data
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="true"' $M
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' $M
      - name: Allow internet and in-app updates (Android still asks you to tap Install)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/></manifest>#' $M
          sed -i 's#<application #<application android:requestLegacyExternalStorage="true" #' $M
          grep -q 'REQUEST_INSTALL_PACKAGES' $M
      - name: Add the update-install plugin
        run: |
          PKG=android/app/src/main/java/com/lokesh/granitebook
          test -f $PKG/MainActivity.java
          grep -q 'fileprovider' android/app/src/main/AndroidManifest.xml
          grep -q 'cache-path' android/app/src/main/res/xml/file_paths.xml
          cat > $PKG/ApkInstallPlugin.java <<'JAVA'
          package com.lokesh.granitebook;

          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;

          @CapacitorPlugin(name = "ApkInstall")
          public class ApkInstallPlugin extends Plugin {
              // opens Android's install screen for an update downloaded into cache/update
              @PluginMethod
              public void installApk(PluginCall call) {
                  try {
                      Context ctx = getContext();
                      String name = call.getString("name", "GraniteBook-update.apk");
                      if (name == null || !name.matches("[A-Za-z0-9._-]{1,80}\\.apk")) {
                          call.reject("Bad update file name");
                          return;
                      }
                      File f = new File(new File(ctx.getCacheDir(), "update"), name);
                      if (!f.exists() || f.length() < 1000000) {
                          call.reject("The update file is missing or incomplete");
                          return;
                      }
                      if (android.os.Build.VERSION.SDK_INT >= 26 && !ctx.getPackageManager().canRequestPackageInstalls()) {
                          Intent s = new Intent(android.provider.Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + ctx.getPackageName()));
                          s.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ctx.startActivity(s);
                          JSObject r = new JSObject();
                          r.put("needPermission", true);
                          call.resolve(r);
                          return;
                      }
                      Uri uri = FileProvider.getUriForFile(ctx, ctx.getPackageName() + ".fileprovider", f);
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(uri, "application/vnd.android.package-archive");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      ctx.startActivity(i);
                      JSObject r = new JSObject();
                      r.put("started", true);
                      call.resolve(r);
                  } catch (Exception e) {
                      call.reject("Could not start the install: " + e.getMessage());
                  }
              }
          }
          JAVA
          cat > $PKG/MainActivity.java <<'JAVA'
          package com.lokesh.granitebook;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ApkInstallPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          grep -q 'registerPlugin(ApkInstallPlugin.class)' $PKG/MainActivity.java
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Verify the APK is signed with the private key and is not debuggable
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f $APK
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs $APK | tee cert.txt
          EXPECT=$(keytool -list -v -keystore "$KS_PATH" -storepass "$KS_PASS" -alias granitebook | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          GOT=$(grep -m1 'SHA-256 digest' cert.txt | awk '{print $NF}')
          [ -n "$EXPECT" ] && [ "$EXPECT" = "$GOT" ]
          if $BT/aapt2 dump badging $APK | grep -q 'application-debuggable'; then echo "::error::APK is debuggable"; exit 1; fi
      - name: Send the APK to Google Drive so the app can offer the update
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
          RUN_NO: ${{ github.run_number }}
        run: |
          if [ -z "$RELEASE_KEY" ] || [ -z "$SYNC_URL" ]; then echo "::warning::RELEASE_KEY or SYNC_URL is not set, so the APK was NOT sent to Drive."; exit 0; fi
          python3 - <<'PY'
          import os,re,json,hashlib,base64,time,urllib.request
          apk=open('android/app/build/outputs/apk/release/app-release.apk','rb').read()
          html=open('index.html',encoding='utf8').read()
          ver=re.search(r"APP_VER='(\d+\.\d+\.\d+)'",html).group(1)
          notes=''
          m=re.search(r"APP_LOG=\[\['"+re.escape(ver)+r"','((?:[^'\\]|\\.)*)'",html)
          if m: notes=m.group(1).replace("\\'","'")[:300]
          sha=hashlib.sha256(apk).hexdigest();b=base64.b64encode(apk).decode();CH=600000
          parts=[b[i:i+CH] for i in range(0,len(b),CH)]
          url=os.environ['SYNC_URL'];key=os.environ['RELEASE_KEY']
          def post(o):
              last=None
              for t in range(4):
                  try:
                      r=urllib.request.urlopen(urllib.request.Request(url,json.dumps({**o,'key':key}).encode(),{'Content-Type':'text/plain'}),timeout=300).read().decode()
                      j=json.loads(r)
                      if j.get('ok'): return j
                      last=j.get('err')
                  except Exception as e: last=str(e)
                  time.sleep(3*(t+1))
              raise SystemExit('::error::Drive upload failed: '+str(last))
          print('version',ver,'size',len(apk),'pieces',len(parts))
          for i,p in enumerate(parts): post({'action':'rel_put','ver':ver,'idx':i,'total':len(parts),'data':p}); print('piece',i,'sent')
          post({'action':'rel_done','ver':ver,'code':int(os.environ['RUN_NO']),'total':len(parts),'size':len(apk),'sha256':sha,'notes':notes})
          print('Published version',ver,'to Drive')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: granite-book-apk
          path: android/app/build/outputs/apk/release/app-release.apk
